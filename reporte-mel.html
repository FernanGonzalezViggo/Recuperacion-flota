<style>
/* Layout: cabecera fija + navegacion por pestañas + grilla de tarjetas y graficos */
:root{
  --bg:#f3f6f3; --surface:#ffffff; --surface2:#f8faf8; --fg:#162019; --muted:#5f6d64;
  --line:#e3e8e3; --accent:#009b48; --accent-ink:#00793a;
  --good:#2e9e5b; --warn:#d99321; --crit:#d6483d;
  --mina:#d6483d; --planta:#d99321; --syb:#009b48;
  --fdisplay:'Barlow Semi Condensed',system-ui,sans-serif;
  --fbody:'Barlow',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1410; --surface:#161d17; --surface2:#1b231c; --fg:#e9efe9; --muted:#95a499;
  --line:#28322a; --accent:#2bb75f; --accent-ink:#36c56b;
  --good:#38b369; --warn:#e3a736; --crit:#e2594d; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1410; --surface:#161d17; --surface2:#1b231c; --fg:#e9efe9; --muted:#95a499;
  --line:#28322a; --accent:#2bb75f; --accent-ink:#36c56b;
  --good:#38b369; --warn:#e3a736; --crit:#e2594d; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--fbody);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--fdisplay);margin:0;text-wrap:balance;letter-spacing:.2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;justify-content:space-between;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .mark{font-family:var(--fdisplay);font-weight:700;font-size:22px;color:var(--accent);letter-spacing:1px}
.brand h1{font-size:19px;font-weight:600}
.brand .sub{color:var(--muted);font-size:12.5px}
.top-right{display:flex;align-items:center;gap:14px;flex-shrink:0}
.corte{font-size:12.5px;color:var(--muted)}
.corte b{color:var(--fg);font-weight:600}
.tbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:6px 10px;cursor:pointer;font-family:var(--fbody);font-size:13px}
.tbtn:hover{color:var(--fg);border-color:var(--accent)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-top:2px}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
  padding:10px 14px;cursor:pointer;font-family:var(--fdisplay);font-weight:600;font-size:15px;letter-spacing:.3px}
nav.tabs button:hover{color:var(--fg)}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs button.locked{color:var(--line);cursor:not-allowed}
nav.tabs button.locked:hover{color:var(--muted)}
main{padding-block:20px 40px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.kpi .val{font-family:var(--fdisplay);font-weight:700;font-size:34px;line-height:1.1;margin-top:4px}
.kpi .foot{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.accent .val{color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h2{font-size:16px;font-weight:600;margin-bottom:12px}
.card .hint{color:var(--muted);font-size:12px;font-weight:400}
.chart-box{position:relative;height:300px}
.chart-box.tall{height:360px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right}
.tbl-scroll{overflow-x:auto}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.pill.mina{background:color-mix(in srgb,var(--mina) 16%,transparent);color:var(--mina)}
.pill.planta{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.syb{background:color-mix(in srgb,var(--syb) 16%,transparent);color:var(--accent-ink)}
.dbar{display:flex;align-items:center;gap:8px}
.dbar .track{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden;min-width:60px}
.dbar .fill{height:100%;border-radius:999px}
.ctr-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.ctr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.ctr .nm{font-family:var(--fdisplay);font-weight:600;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.ctr .big{font-family:var(--fdisplay);font-weight:700;font-size:30px;margin:6px 0 2px}
.ctr .meta{font-size:12px;color:var(--muted)}
.ctr .track{height:9px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:10px}
.ctr .fill{height:100%;border-radius:999px}
.sct{margin-bottom:18px}
.sct h2{font-size:17px;margin-bottom:12px;font-weight:600}
.note{background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:20px;color:var(--muted);font-size:13.5px}
.note b{color:var(--fg)}
.days-chip{font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
footer{color:var(--muted);font-size:12px;padding-block:18px;border-top:1px solid var(--line);margin-top:10px}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.ctr-cards{grid-template-columns:1fr}}
</style>
</head>

const cc={'Mina':'mina','Planta':'planta','Sube y baja':'syb'};
const col=k=>({mina:getCss('--mina'),planta:getCss('--warn'),syb:getCss('--syb')}[cc[k]]||getCss('--accent'));
function getCss(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function dispColor(p){return p>=90?getCss('--good'):p>=80?getCss('--warn'):getCss('--crit')}
let charts=[];
function clearCharts(){charts.forEach(c=>c.destroy());charts=[]}

document.getElementById('corte').textContent=D.fecha_corte;

// KPIs
const k=D.kpi;
document.getElementById('kpis').innerHTML=`
  <div class="kpi"><div class="lbl">Flota total</div><div class="val">${k.flota}</div><div class="foot">equipos activos</div></div>
  <div class="kpi"><div class="lbl">Operativos</div><div class="val" style="color:var(--good)">${k.operativos}</div><div class="foot">al corte</div></div>
  <div class="kpi"><div class="lbl">Detenidos</div><div class="val" style="color:var(--crit)">${k.detenidos}</div><div class="foot">fuera de servicio</div></div>
  <div class="kpi accent"><div class="lbl">Disponibilidad</div><div class="val">${k.disp_global}%</div><div class="foot">flota global</div></div>`;

const TABS=[
 {id:'disp',name:'Disponibilidad',on:1},
 {id:'planes',name:'Planes',on:1},
 {id:'sistema',name:'Detención por sistema',on:1},
 {id:'ruta',name:'Fallas en ruta',on:0},
 {id:'mp',name:'Mant. Preventivo',on:0},
 {id:'camp',name:'Campañas',on:0},
];
const nav=document.getElementById('tabs');
TABS.forEach((t,i)=>{const b=document.createElement('button');b.textContent=t.name;b.setAttribute('role','tab');
 if(!t.on)b.className='locked';b.onclick=()=>{if(t.on)show(t.id)};nav.appendChild(b);t._el=b});
function markTab(id){TABS.forEach(t=>t._el.setAttribute('aria-selected',t.id===id?'true':'false'))}

function pill(c){return `<span class="pill ${cc[c]||''}">${c}</span>`}

function viewDisp(){
 const v=document.getElementById('view');
 let ctr=D.resumen.map(r=>`<div class="ctr"><div class="nm">${pill(r['Por contrato'])}<span>${r.disp}%</span></div>
   <div class="big" style="color:${dispColor(r.disp)}">${r.oper}/${r.total}</div>
   <div class="meta">${r.detenidos} detenidos</div>
   <div class="track"><div class="fill" style="width:${r.disp}%;background:${dispColor(r.disp)}"></div></div></div>`).join('');
 let det=D.detenidos.map(d=>`<tr><td><b>${d.Equipo}</b></td><td>${d.Tipo}</td><td>${pill(d['Por contrato'])}</td>
   <td>${d.Motivo||'—'}</td><td>${d['Fecha detencion']||'—'}</td><td class="num days-chip" style="color:${d.dias>=15?'var(--crit)':d.dias>=7?'var(--warn)':'var(--fg)'}">${d.dias}</td></tr>`).join('');
 v.innerHTML=`
  <div class="ctr-cards">${ctr}</div>
  <div class="card sct"><h2>Disponibilidad diaria por contrato <span class="hint">· últimos 90 días (%)</span></h2>
    <div class="legend"><span><i style="background:var(--mina)"></i>Mina</span><span><i style="background:var(--warn)"></i>Planta</span><span><i style="background:var(--syb)"></i>Sube y Baja</span></div>
    <div class="chart-box tall"><canvas id="cDisp"></canvas></div></div>
  <div class="grid2">
   <div class="card"><h2>Resumen por contrato y tipo</h2><div class="tbl-scroll"><table>
     <thead><tr><th>Contrato</th><th>Tipo</th><th class="num">Flota</th><th class="num">Oper.</th><th class="num">Det.</th><th>Disponibilidad</th></tr></thead>
     <tbody>${D.snapshot.map(s=>`<tr><td>${pill(s['Por contrato'])}</td><td>${s.Tipo}</td><td class="num">${s.total}</td><td class="num">${s.oper}</td><td class="num">${s.detenidos}</td>
       <td><div class="dbar"><div class="track"><div class="fill" style="width:${s.disp}%;background:${dispColor(s.disp)}"></div></div><span>${s.disp}%</span></div></td></tr>`).join('')}</tbody>
     </table></div></div>
   <div class="card"><h2>Equipos detenidos <span class="hint">· ${D.detenidos.length} al corte</span></h2><div class="tbl-scroll" style="max-height:360px;overflow-y:auto"><table>
     <thead><tr><th>Equipo</th><th>Tipo</th><th>Contrato</th><th>Motivo</th><th>F. detención</th><th class="num">Días</th></tr></thead>
     <tbody>${det}</tbody></table></div></div>
  </div>`;
 clearCharts();
 const ctx=document.getElementById('cDisp');
 charts.push(new Chart(ctx,{type:'line',data:{labels:D.disp_fechas,datasets:[
   {label:'Mina',data:D.disp_series['Mina'],borderColor:getCss('--mina'),backgroundColor:'transparent',tension:.3,pointRadius:0,borderWidth:2},
   {label:'Planta',data:D.disp_series['Planta'],borderColor:getCss('--warn'),backgroundColor:'transparent',tension:.3,pointRadius:0,borderWidth:2},
   {label:'Sube y Baja',data:D.disp_series['Sube y baja'],borderColor:getCss('--syb'),backgroundColor:'transparent',tension:.3,pointRadius:0,borderWidth:2},
  ]},options:chartOpts({ymin:50,ymax:100,suffix:'%',ticks:10})}));
}

function viewPlanes(){
 const v=document.getElementById('view');
 const rows=D.planes.map(p=>{const hasPlan=(p['Plan de accion']||'').trim().length>0;
   return `<tr><td><b>${p.Equipo}</b></td><td>${pill(p['Por contrato'])}</td><td>${p.Motivo||'—'}</td>
   <td class="num">${p.dias}</td><td style="white-space:normal;min-width:220px;${hasPlan?'':'color:var(--muted)'}">${hasPlan?p['Plan de accion']:'— sin plan —'}</td>
   <td>${p.Responsable||'—'}</td><td>${p['Fecha compromiso']||'—'}</td></tr>`}).join('');
 v.innerHTML=`<div class="card"><h2>Planes de acción de equipos detenidos <span class="hint">· ${D.planes.length} equipos</span></h2>
   <div class="tbl-scroll"><table><thead><tr><th>Equipo</th><th>Contrato</th><th>Motivo</th><th class="num">Días</th><th>Plan de acción</th><th>Responsable</th><th>F. compromiso</th></tr></thead>
   <tbody>${rows}</tbody></table></div></div>`;
 clearCharts();
}

function viewSistema(){
 const v=document.getElementById('view');
 v.innerHTML=`<div class="grid2">
   <div class="card"><h2>Días de detención por sistema <span class="hint">· detenidos actuales</span></h2><div class="chart-box tall"><canvas id="cSisDias"></canvas></div></div>
   <div class="card"><h2>Fallas acumuladas por sistema <span class="hint">· año 2026</span></h2><div class="chart-box tall"><canvas id="cSisAnual"></canvas></div></div>
 </div>`;
 clearCharts();
 const s=D.sistema;
 charts.push(new Chart(document.getElementById('cSisDias'),{type:'bar',
   data:{labels:s.map(x=>x.Motivo),datasets:[{label:'Días',data:s.map(x=>x.dias),backgroundColor:getCss('--accent'),borderRadius:4}]},
   options:chartOpts({horiz:true})}));
 const a=D.sistema_anual;
 charts.push(new Chart(document.getElementById('cSisAnual'),{type:'bar',
   data:{labels:a.map(x=>x.Motivo),datasets:[{label:'Fallas',data:a.map(x=>x.fallas),backgroundColor:getCss('--accent-ink'),borderRadius:4}]},
   options:chartOpts({horiz:true})}));
}

function chartOpts(o){o=o||{};const grid=getCss('--line'),fg=getCss('--muted');
 const base={responsive:true,maintainAspectRatio:false,
   plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${c.parsed[o.horiz?'x':'y']}${o.suffix||''}`}}},
   scales:{}};
 if(o.horiz){base.indexAxis='y';
   base.scales.x={grid:{color:grid},ticks:{color:fg},beginAtZero:true};
   base.scales.y={grid:{display:false},ticks:{color:fg,font:{size:11}}};
 }else{
   base.scales.y={grid:{color:grid},ticks:{color:fg,callback:v=>v+(o.suffix||'')},min:o.ymin,max:o.ymax};
   base.scales.x={grid:{display:false},ticks:{color:fg,maxTicksLimit:o.ticks||12,autoSkip:true}};
 }
 return base}

function show(id){markTab(id);
 if(id==='disp')viewDisp();else if(id==='planes')viewPlanes();else if(id==='sistema')viewSistema()}

// tema
const root=document.documentElement;
function setTheme(t){try{if(t){root.setAttribute('data-theme',t);localStorage.setItem('mel-theme',t)}}catch(e){}
 const cur=show._cur;if(cur)show(cur)}
document.getElementById('theme').onclick=()=>{
 const now=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
 setTheme(now==='dark'?'light':'dark')};
try{const sv=localStorage.getItem('mel-theme');if(sv)root.setAttribute('data-theme',sv)}catch(e){}
const _show=show;show=function(id){_show.show_cur;show._cur=id;_show(id)};
show('disp');
</script>
</body>
</html>
